<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  body { text-align:center; font-family:sans-serif; }
  .board { display:grid; grid-template-columns:repeat(3,100px); gap:5px; margin:20px auto; }
  .cell { width:100px; height:100px; background:#eee; font-size:2em; display:flex; justify-content:center; align-items:center; cursor:pointer; }
  .cell:hover { background:#ddd; }
  button { margin-top:15px; padding:8px 20px; }
</style>
</head>
<body>
<h2>Tic Tac Toe</h2>
<div class="board" id="board"></div>
<p id="status"></p>
<button onclick="resetGame()">Restart</button>

<script>
let board = ['', '', '', '', '', '', '', '', ''];
let current = 'X';
let gameOver = false;
const cells = [];

function createBoard() {
  const boardDiv = document.getElementById('board');
  boardDiv.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => makeMove(i));
    boardDiv.appendChild(cell);
    cells.push(cell);
  }
}

function makeMove(i) {
  if (board[i] || gameOver) return;
  board[i] = current;
  cells[i].textContent = current;
  if (checkWin()) {
    document.getElementById('status').textContent = `${current} wins!`;
    gameOver = true;
  } else if (board.every(c => c)) {
    document.getElementById('status').textContent = 'Draw!';
  } else {
    current = current === 'X' ? 'O' : 'X';
  }
}

function checkWin() {
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return wins.some(([a,b,c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
}

function resetGame() {
  board = ['', '', '', '', '', '', '', '', ''];
  gameOver = false;
  current = 'X';
  document.getElementById('status').textContent = '';
  cells.forEach(c => c.textContent = '');
}

createBoard();
</script>
</body>
</html>
